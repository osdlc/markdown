# Builds this repository's corpus-schema, packages/ts/corpus-schema, and puts
# its `corpus-schema` command on PATH. A workflow that checks a corpus with the
# repository's own validator, rather than a release from npm, runs this after
# actions/checkout and actions/setup-node.
#
# The install takes only corpus-schema and its dependencies from the root
# lockfile. While the root package.json names devDependencies the lockfile
# does not hold yet (@osdlc/package-checks 0.1.0 is not on npm), a frozen
# install fails. The step then drops the root devDependencies for this run
# only and installs again. Once the lockfile catches up, the first install
# passes and the fallback never runs.
name: corpus-schema from this repository
description: Installs and builds packages/ts/corpus-schema and puts corpus-schema on PATH.

runs:
  using: composite
  steps:
    - name: Install and build corpus-schema
      shell: bash
      run: |
        corepack enable
        if ! pnpm install --frozen-lockfile --filter @osdlc/corpus-schema; then
          echo "::notice::the root lockfile is behind package.json; installing without the root devDependencies"
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            delete pkg.devDependencies;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          pnpm install --frozen-lockfile --filter @osdlc/corpus-schema
          git checkout -- package.json
        fi
        pnpm --filter @osdlc/corpus-schema run build
        # The bin file is corpus-schema.js, so a link gives the command its name.
        mkdir -p "$RUNNER_TEMP/corpus-schema-bin"
        ln -sf "$GITHUB_WORKSPACE/packages/ts/corpus-schema/bin/corpus-schema.js" \
          "$RUNNER_TEMP/corpus-schema-bin/corpus-schema"
        echo "$RUNNER_TEMP/corpus-schema-bin" >> "$GITHUB_PATH"
