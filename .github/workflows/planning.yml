# Checks the plan's records in docs/planning/, the planning profile they extend in
# profiles/planning/, and the explorer built from them.
#
# Both jobs build the validator from packages/ts/corpus-schema with tools/build-corpus-schema.sh,
# not take it from npm: the plan uses `extends` and `x-extends`, which 0.2.0 does not know.
#
# validate: the plan and the profile must pass corpus-schema with no errors and no warnings. The
# profile is validated on its own too: the plan's report carries a parent's errors, not its
# warnings.
#
# explorer: installs tools/explorer, whose @osdlc/corpus-schema is a link: to the built package,
# rebuilds data/*.json from the records and fails when the committed JSON differs, then
# typechecks, tests and builds the explorer.
#
# Every action is pinned to a commit SHA; the comment names its release.
name: planning

on:
  pull_request:
    paths:
      - "docs/planning/**"
      - "profiles/planning/**"
      - "tools/explorer/**"
      - "packages/ts/corpus-schema/**"
      - "pnpm-lock.yaml"
      - "tools/build-corpus-schema.sh"
      - "tools/validate-strict.sh"
      - "tools/validator.sh"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/planning.yml"
  push:
    branches: [main]
    paths:
      - "docs/planning/**"
      - "profiles/planning/**"
      - "tools/explorer/**"
      - "packages/ts/corpus-schema/**"
      - "pnpm-lock.yaml"
      - "tools/build-corpus-schema.sh"
      - "tools/validate-strict.sh"
      - "tools/validator.sh"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/planning.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # corepack provides the pnpm that package.json's packageManager names.
      - name: Build corpus-schema
        run: |
          corepack enable
          sh tools/build-corpus-schema.sh

      # Fails on a warning as well as on an error.
      - name: Validate the plan's records
        run: sh tools/validate-strict.sh docs/planning profiles/planning

  explorer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/explorer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Build corpus-schema
        run: |
          corepack enable
          sh ../build-corpus-schema.sh

      # The explorer has its own lockfile and is not in the repo's workspace.
      - name: Install
        run: pnpm install --ignore-workspace --frozen-lockfile

      - name: The committed data matches the records
        run: |
          pnpm build-data
          git diff --exit-code -- data
          test -z "$(git status --porcelain -- data)"

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
