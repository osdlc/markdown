# Checks the libraries under packages/ts/ on every pull request. On a push to
# main, packages-publish.yml calls this workflow and releases only if it
# passes.
#
# The root package-checks.json lists this file as shared, so a change here
# checks every package.
name: packages

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels this workflow's older run,
# whose result no longer matters. Other events get a group of their own, so a
# call from packages-publish.yml is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packages:
    uses: osdlc/osdlc/.github/workflows/ts-packages-ci.yml@aaa35db118c6dcffb3b3c742c67162ef2cce5ba0 # osdlc/osdlc main
    with:
      os: '["ubuntu-latest", "macos-latest"]'
      node: '["22", "24"]'
