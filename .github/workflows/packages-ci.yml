# Checks the libraries under packages/ts/ on every pull request. On a push to
# main, packages-publish.yml calls this workflow and releases only if it
# passes.
#
# The `packages` job calls ts-packages-ci.yml from osdlc/osdlc, the shared CI
# for repositories that publish packages the way osdlc/osdlc does; its header
# says what it checks. Its jobs report as `packages / changes` and
# `packages / verify (<os>, node <n>)`. A pull request checks only the
# packages it changed and the packages that depend on them. The root
# package-checks.json names this file as shared, so a pull request that only
# moves the pin below checks every package. A run that is not a pull request
# checks every package, including the call from packages-publish.yml.
#
# The shared workflow runs `package-checks` and `conformance` from this
# repository's root devDependencies, so the lockfile pins their versions.
name: packages

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels this workflow's older run,
# whose result no longer matters. Other events get a group of their own, so a
# call from packages-publish.yml is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packages:
    # TODO: pin to osdlc main after osdlc/osdlc#749 merges
    uses: osdlc/osdlc/.github/workflows/ts-packages-ci.yml@52581f8e2438b4d54f5ccd32e023c171d90cb737 # shared-ci/workflows
