# Temporary. Builds, tests, smokes and typechecks the packages under
# packages/ts/ on every pull request and push to main. The shared osdlc workflows, being
# extracted in osdlc/osdlc, replace this file, and add the lint, format,
# package and conformance checks and the publish workflow.
#
# Every action is pinned to a commit SHA; the comment names its release.
name: packages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build first: the tests run the built CLI.
      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

      # Runs the built package by name, which the unit tests do not.
      - name: Smoke
        run: pnpm -r --if-present run smoke

      - name: Typecheck
        run: pnpm -r typecheck
