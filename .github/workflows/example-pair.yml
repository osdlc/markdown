# Checks the example pair under examples/: an org principles corpus, and the
# fernlog project corpus that references it and extends the claims profile.
#
# The validator is this repository's packages/ts/corpus-schema, built by
# tools/build-corpus-schema.sh, since the published 0.2.x does not read
# `extends` or `references`. fernlog installs the claims profile from profiles/claims/ with
# its own lockfile; it is not in the repository's workspace.
#
# Every action is pinned to a commit SHA; the comment names its release.
name: example-pair

on:
  pull_request:
    paths:
      - "examples/**"
      - "profiles/claims/**"
      - "packages/ts/corpus-schema/**"
      - "pnpm-lock.yaml"
      - "tools/build-corpus-schema.sh"
      - ".github/workflows/example-pair.yml"
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "profiles/claims/**"
      - "packages/ts/corpus-schema/**"
      - "pnpm-lock.yaml"
      - "tools/build-corpus-schema.sh"
      - ".github/workflows/example-pair.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # corepack provides the pnpm that package.json's packageManager names.
      - name: Build corpus-schema
        run: |
          corepack enable
          sh tools/build-corpus-schema.sh

      - name: Install the claims profile for fernlog
        working-directory: examples/fernlog
        run: pnpm install --ignore-workspace --frozen-lockfile

      - name: Validate both corpora
        run: sh tools/validate-strict.sh examples

      # validate does not ask for a copy that nothing links into, but sync
      # still writes it. intent-to-add makes a new file show in the diff.
      - name: The committed _references/ copy is current
        run: |
          node packages/ts/corpus-schema/bin/corpus-schema.js sync examples
          git add --intent-to-add -- examples
          if ! git diff --exit-code -- examples; then
            echo "::error::examples/fernlog/_references/ is stale; run corpus-schema sync examples and commit"
            exit 1
          fi

      - name: Check that the validator catches a stale copy and a wrong link
        run: sh examples/test.sh
