# Checks the example pair under examples/: an org principles corpus, and the
# fernlog project corpus that extends it and the claims profile.
#
# The validator is this repository's packages/ts/corpus-schema, built by the
# local corpus-schema action, since the published 0.2.x does not read
# `extends`. fernlog installs the claims profile from profiles/claims/ with
# its own lockfile; it is not in the repository's workspace.
#
# Both corpora must validate with no errors and no warnings. The validator
# fails when fernlog's _inherited/ copy does not match its parents. A sync must
# then change nothing, and examples/test.sh checks that the validator catches
# a stale copy and a link to the wrong type.
#
# Every action is pinned to a commit SHA; the comment names its release.
name: example-pair

on:
  pull_request:
    paths:
      - "examples/**"
      - "profiles/claims/**"
      - "packages/ts/corpus-schema/**"
      - ".github/actions/corpus-schema/**"
      - ".github/workflows/example-pair.yml"
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "profiles/claims/**"
      - "packages/ts/corpus-schema/**"
      - ".github/actions/corpus-schema/**"
      - ".github/workflows/example-pair.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: ./.github/actions/corpus-schema

      - name: Install fernlog's parents
        working-directory: examples/fernlog
        run: pnpm install --ignore-workspace --frozen-lockfile

      # The validator prints warnings on stderr and still exits 0, so the
      # step keeps stderr and fails on any warning line.
      - name: Validate both corpora
        run: |
          set +e
          corpus-schema validate examples 2> "$RUNNER_TEMP/stderr.txt"
          status=$?
          set -e
          cat "$RUNNER_TEMP/stderr.txt" >&2
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if grep -q '^warning:' "$RUNNER_TEMP/stderr.txt"; then
            echo "::error::the example corpora must validate with no warnings"
            exit 1
          fi

      - name: The committed _inherited/ copy is current
        run: |
          corpus-schema sync examples
          git diff --exit-code -- examples
          test -z "$(git status --porcelain -- examples)"

      - name: Check that the validator catches a stale copy and a wrong link
        run: sh examples/test.sh
