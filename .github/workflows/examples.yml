# Checks the claims profile under profiles/claims/ with the corpus-schema
# validator. The profile's corpus and its example must pass with no errors and
# no warnings. Each broken record under profiles/claims/tests/ must fail with
# its one expected error, and the packed package must work when a corpus names
# it by its package name.
#
# The validator is this repository's packages/ts/corpus-schema, built by
# tools/build-corpus-schema.sh, because the example extends the profile and the
# published 0.2.x does not read `extends`. Other workflows that need this
# validator run the same script.
#
# Every action is pinned to a commit SHA; the comment names its release.
name: examples

on:
  pull_request:
    paths:
      - "profiles/**"
      - "packages/ts/corpus-schema/**"
      - "pnpm-lock.yaml"
      - "tools/build-corpus-schema.sh"
      - ".github/workflows/examples.yml"
  push:
    branches: [main]
    paths:
      - "profiles/**"
      - "packages/ts/corpus-schema/**"
      - "pnpm-lock.yaml"
      - "tools/build-corpus-schema.sh"
      - ".github/workflows/examples.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Build corpus-schema
        run: |
          corepack enable
          sh tools/build-corpus-schema.sh

      - name: Validate the claims profile and its example
        run: sh tools/validate-strict.sh profiles/claims/corpus profiles/claims/example

      - name: Check that the broken claims records fail
        run: sh profiles/claims/tests/run.sh

      - name: Check the packed profile
        run: sh profiles/claims/tests/package.sh
