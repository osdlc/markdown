packages:
  - 'packages/ts/*'
  - 'profiles/*'

# Versions shared across the workspace. A package or the root names one as
# `"catalog:"`, so a bump is one edit here. `pnpm pack` and `pnpm publish`
# write the concrete range into the packed package.json. Keep them in step
# with osdlc/osdlc's catalog.
catalog:
  '@changesets/cli': 3.0.3
  '@types/node': ^26.1.0
  '@vitest/coverage-v8': ^5.0.5
  oxlint: ^1.65.0
  prettier: 3.9.6
  typescript: ~6.0.3
  vitest: ^5.0.5
  yaml: ^2.9.0
