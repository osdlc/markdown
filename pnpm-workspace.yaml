packages:
  - 'packages/ts/*'

# Versions shared across the packages. A package names one as `"catalog:"`, so
# a bump is one edit here. `pnpm pack` and `pnpm publish` write the concrete
# range into the packed package.json. The versions match osdlc/osdlc's catalog.
catalog:
  '@types/node': ^26.1.0
  '@vitest/coverage-v8': ^5.0.5
  oxlint: ^1.65.0
  prettier: 3.9.6
  typescript: ~6.0.3
  vitest: ^5.0.5
  yaml: ^2.9.0
