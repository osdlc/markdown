<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 1636" width="880" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-label="The layers of the markdown ecosystem, top to bottom"><style>
