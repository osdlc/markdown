ceptance testing</text><text x="234" y="725" class="cs">builds on evidence</text></g><rect class="band" x="6" y="758" width="428" height="206" rx="10"/><text class="lnum" x="414" y="782" text-anchor="end">4</text><text class="rl" x="16" y="782">corpus-schema</text><text class="rs" x="16" y="797">the spec and its validator</text><text class="lang" x="18" y="814">TYPESCRIPT</text><g class="chip r-osdlc"><rect x="16" y="826" width="200" height="46" rx="7"/><circle cx="28" cy="842" r="4.5" class="dot"/><text x="38" y="846" class="cn">@osdlc/corpus-schema</text><text x="26" y="863" class="cs">levels 0–2, validate --fix</text></g><text class="lang" x="18" y="890">RUST</text><g class="chip r-osdlc later"><rect x="16" y="902" width="200" height="46" rx="7"/><circle cx="28" cy="918" r="4.5" class="dot"/><text x="38" y="922" class="cn">Rust validator</text><text x="26" y="939" class="cs">later, same tests</text></g><rect class="band" x="6" y="972" width="428" height="206" rx="10"/><text class="lnum" x="414" y="996" text-anchor="end">3</text><text class="rl" x="16" y="996">Corpus model</text><text class="rs" x="16" y="1011">every note and link, kept fresh</text><text class="lang" x="18" y="1028">TYPESCRIPT</text><g class="chip r-osdlc later"><rect x="16" y="1040" width="200" height="46" rx="7"/><circle cx="28" cy="1056" r="4.5" class="dot"/><text x="38" y="1060" class="cn">markdown-corpus</text><text x="26" y="1077" class="cs">from vault + graph</text></g><text class="lang" x="18" y="1104">RUST</text><g class="chip r-osdlc"><rect x="16" y="1116" width="200" height="46" rx="7"/><circle cx="28" cy="1132" r="4.5" class="dot"/><text x="38" y="1136" class="cn">markdown-corpus</text><text x="26" y="1153" class="cs">the twin</text></g><g class="chip r-osdlc"><rect x="224" y="1116" width="200" height="46" rx="7"/><circle cx="236" cy="1132" r="4.5" class="dot"/><text x="246" y="1136" class="cn">markdown-relink</text><text x="234" y="1153" class="cs">move notes, fix links</text></g><rec