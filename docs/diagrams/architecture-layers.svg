n">markdown-render</text><text x="26" y="389" class="cs">notes → HTML</text></g><g class="chip r-osdlc"><rect x="224" y="352" width="200" height="46" rx="7"/><circle cx="236" cy="368" r="4.5" class="dot"/><text x="246" y="372" class="cn">markdown-editor</text><text x="234" y="389" class="cs">live editor</text></g><g class="chip r-osdlc"><rect x="16" y="412" width="200" height="46" rx="7"/><circle cx="28" cy="428" r="4.5" class="dot"/><text x="38" y="432" class="cn">markdown-ui</text><text x="26" y="449" class="cs">viewing chrome</text></g><g class="chip r-osdlc"><rect x="224" y="412" width="200" height="46" rx="7"/><circle cx="236" cy="428" r="4.5" class="dot"/><text x="246" y="432" class="cn">markdown-astro</text><text x="234" y="449" class="cs">notes → site</text></g><rect class="band" x="6" y="482" width="428" height="130" rx="10"/><text class="num" x="414" y="506" text-anchor="end">6</text><text class="rl" x="16" y="506">Query (later)</text><text class="rs" x="16" y="521">read a corpus as a database</text><text class="lang" x="18" y="538">TYPESCRIPT</text><g class="chip r-osdlc later"><rect x="16" y="550" width="200" height="46" rx="7"/><circle cx="28" cy="566" r="4.5" class="dot"/><text x="38" y="570" class="cn">query layer</text><text x="26" y="587" class="cs">Bases queries, loader, builds</text></g><rect class="band" x="6" y="620" width="428" height="130" rx="10"/><text class="num" x="414" y="644" text-anchor="end">5</text><text class="rl" x="16" y="644">Profiles (proposal)</text><text class="rs" x="16" y="659">shared sets of types</text><text class="lang" x="18" y="676">TYPESCRIPT</text><g class="chip r-osdlc later"><rect x="16" y="688" width="200" height="46" rx="7"/><circle cx="28" cy="704" r="4.5" class="dot"/><text x="38" y="708" class="cn">evidence profile</text><text x="26" y="725" class="cs">sources, findings, claims</text></g><g class="chip r-osdlc later"><rect x="224" y="688" width="200" height="46" rx="7"/><circle cx="236" cy="704" r="4.5" class="dot"/><text x="246" y="708" class="cn">acceptance testing</text><text x="234" y="725" class="cs">builds on evidence</text></g><rect class="band" x="6" y="758" width="428" height="206" rx="10"/><text class="num" x="414" y="782" text-anchor="end">4</text><text class="rl" x="16" y="782">corpus-schema</text><text class="rs" x="16" y="797">the spec and its validator</text><text class="lang" x="18" y="814">TYPESCRIPT</text><g class="chip r-osdlc"><rect x="16" y="826" width="200" height="46" rx="7"/><circle cx="28" cy="842" r="4.5" class="dot"/><text x="38" y="846" class="cn">@osdlc/corpus-schema</text><text x="26" y="863" class="cs">levels 0–2, validate --fix</text></g><text class="lang" x="18" y="890">RUST</text><g class="chip r-osdlc later"><rect x="16" y="902" width="200" height="46" rx="7"/><circle cx="28" cy="918" r="4.5" class="dot"/><text x="38" y="922" class="cn">Rust validator</text><text x="26" y="939" class="cs">later, same tests</text></g><rect class="band" x="6" y="972" width="428" height="206" rx="10"/><text class="num" x="414" y="996" text-anchor="end">3</text><text class="rl" x="16" y="996">Corpus model</text><text class="rs" x="16" y="1011">every note and link, kept fresh</text><text class="lang" x="18" y="1028">TYPESCRIPT</text><g class="chip r-osdlc later"><rect x="16" y="1040" width="200" height="46" rx="7"/><circle cx="28" cy="1056" r="4.5" class="dot"/><text x="38" y="1060" class="cn">markdown-corpus</text><text x="26" y="1077" class="cs">from vault + graph</text></g><text class="lang" x="18" y="1104">RUST</text><g class="chip r-osdlc"><rect x="16" y="1116" width="200" height="46" rx="7"/><circle cx="28" cy="1132" r="4.5" class="dot"/><text x="38" y="1136" class="cn">markdown-corpus</text><text x="26" y="1153" class="cs">the twin</text></g><g class="chip r-osdlc"><rect x="224" y="1116" width="200" height="46" rx="7"/><circle cx="236" cy="1132" r="4.5" class="dot"/><text x="246" y="1136" class="cn">markdown-relink</text><text x="234" y="1153" class="cs">move notes, fix links</text></g><rect class="band" x="6" y="1186" width="428" height="206" rx="10"/><text class="num" x="414" y="1210" text-anchor="end">2</text><text class="rl" x="16" y="1210">Note parts</text><text class="rs" x="16" y="1225">one note&#x27;s pieces; one link resolver</text><text class="lang" x="18" y="1242">TYPESCRIPT</text><g class="chip r-osdlc"><rect x="16" y="1254" width="200" height="46" rx="7"/><circle cx="28" cy="1270" r="4.5" class="dot"/><text x="38" y="1274" class="cn">markdown-link</text><text x="26" y="1291" class="cs">+ LinkIndex</text></g><g class="chip r-osdlc"><rect x="224" y="1254" width="200" height="46" rx="7"/><circle cx="236" cy="1270" r="4.5" class="dot"/><text x="246" y="1274" class="cn">frontmatter, yaml, tags</text><text x="234" y="1291" class="cs">lossless edits</text></g><text class="lang" x="18" y="1318">RUST</text><g class="chip r-osdlc"><rect x="16" y="1330" width="200" height="46" rx="7"/><circle cx="28" cy="1346" r="4.5" class="dot"/><text x="38" y="1350" class="cn">markdown-link</text><text x="26" y="1367" class="cs">LinkIndex</text></g><g class="chip r-osdlc"><rect x="224" y="1330" width="200" height="46" rx="7"/><circle cx="236" cy="1346" r="4.5" class="dot"/><text x="246" y="1350" class="cn">frontmatter, yaml, tags</text><text x="234" y="1367" class="cs">twins</text></g><rect class="band" x="6" y="1400" width="428" height="206" rx="10"/><text class="num" x="414" y="1424" text-anchor="end">1</text><text class="rl" x="16" y="1424">Files</text><text class="rs" x="16" y="1439">walk, read, write safely</text><text class="lang" x="18" y="1456">TYPESCRIPT</text><g class="chip r-osdlc"><rect x="16" y="1468" width="200" height="46" rx="7"/><circle cx="28" cy="1484" r="4.5" class="dot"/><text x="38" y="1488" class="cn">etag-write, path-guard</text><text x="26" y="1505" class="cs">safe writes and paths</text></g><text class="lang" x="18" y="1532">RUST</text><g class="chip r-osdlc"><rect x="16" y="1544" width="200" height="46" rx="7"/><circle cx="28" cy="1560" r="4.5" class="dot"/><text x="38" y="1564" class="cn">vault-fs, vfs-walk, seam</text><text x="26" y="1581" class="cs">walk any file system</text></g><text class="cs" x="16" y="1624">Each layer uses only the layers below it. Dashed: not built yet.</text></svg>
