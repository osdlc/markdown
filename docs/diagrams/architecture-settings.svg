<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 496" width="880" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-label="Level, dialect and profiles, with a root file example"><style>
.bg{fill:#fbfaf7} .band{fill:#f0eee8}
.rl{font-size:15px;font-weight:650;fill:#1d1d1b} .rs{font-size:12px;fill:#5d5d58}
.num{font-size:12px;font-weight:700;fill:#5d5d58}
.lang{font-size:10.5px;font-weight:700;letter-spacing:.06em;fill:#5d5d58}
.chip rect{fill:#ffffff;stroke-width:1.5} .chip.later rect{fill:none;stroke-dasharray:5 4}
.cn{font-size:13px;font-weight:650;fill:#1d1d1b} .cs{font-size:11px;fill:#5d5d58}
.r-osdlc rect{stroke:#2f855a} .r-osdlc .dot{fill:#2f855a}
.r-dev rect{stroke:#2b6cb0} .r-dev .dot{fill:#2b6cb0}
.r-ont rect{stroke:#6b46c1} .r-ont .dot{fill:#6b46c1}
.r-sw rect{stroke:#c05621} .r-sw .dot{fill:#c05621}
.r-ext rect{stroke:#8a8a84} .r-ext .dot{fill:#8a8a84}
.box rect{fill:#ffffff;stroke:#d8d5cc;stroke-width:1.4} .box.opt rect{stroke-dasharray:5 4}
.prof rect{fill:#fde7c8;stroke:#b8741a;stroke-width:1.4}
.code rect{fill:#ffffff;stroke:#d8d5cc} .code text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#1d1d1b}
.edge{fill:none;stroke:#5d5d58;stroke-width:1.4} .ahp{fill:#5d5d58}
@media (prefers-color-scheme: dark) {
.bg{fill:#16161a} .band{fill:#222227}
.rl{font-size:15px;font-weight:650;fill:#ececea} .rs{font-size:12px;fill:#a3a39d}
.num{font-size:12px;font-weight:700;fill:#a3a39d}
.lang{font-size:10.5px;font-weight:700;letter-spacing:.06em;fill:#a3a39d}
.chip rect{fill:#2b2b31;stroke-width:1.5} .chip.later rect{fill:none;stroke-dasharray:5 4}
.cn{font-size:13px;font-weight:650;fill:#ececea} .cs{font-size:11px;fill:#a3a39d}
.r-osdlc rect{stroke:#68d391} .r-osdlc .dot{fill:#68d391}
.r-dev rect{stroke:#63b3ed} .r-dev .dot{fill:#63b3ed}
.r-ont rect{stroke:#b794f4} .r-ont .dot{fill:#b794f4}
.r-sw rect{stroke:#f6ad55} .r-sw .dot{fill:#f6ad55}
.r-ext rect{stroke:#a0a09a} .r-ext .dot{fill:#a0a09a}
.box rect{fill:#2b2b31;stroke:#3a3a40;stroke-width:1.4} .box.opt rect{stroke-dasharray:5 4}
