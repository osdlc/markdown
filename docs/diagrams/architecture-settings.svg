}</style><rect class="bg" width="440" height="496"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" class="ahp"/></marker></defs><text class="rl" x="16" y="26">Three settings on a corpus</text><text class="rs" x="16" y="44">Each answers a different question. Proposal.</text><g class="code"><rect x="16" y="58" width="408" height="88" rx="8"/><text x="30" y="80"># corpus-schema.md</text><text x="30" y="98">level: 2</text><text x="30" y="116">dialect: obsidian</text><text x="30" y="134">profiles: [acceptance-testing@0]</text></g><text class="rl" x="16" y="164">Level</text><text class="rs" x="68" y="164">how much it declares</text><g class="box"><rect x="16" y="176" width="130" height="48" rx="8"/></g><text class="cn" x="28" y="197">Level 0</text><text class="cs" x="28" y="214">nothing</text><g class="box"><rect x="154" y="176" width="130" height="48" rx="8"/></g><text class="cn" x="166" y="197">Level 1</text><text class="cs" x="166" y="214">root file, ids</text><path class="edge" d="M147,200 L153,200" marker-end="url(#ah)"/><g class="box"><rect x="292" y="176" width="130" height="48" rx="8"/></g><text class="cn" x="304" y="197">Level 2</text><text class="cs" x="304" y="214">a schema per type</text><path class="edge" d="M285,200 L291,200" marker-end="url(#ah)"/><text class="rl" x="16" y="252">Dialect</text><text class="rs" x="80" y="252">syntax beyond the baseline</text><g class="box"><rect x="16" y="264" width="200" height="48" rx="8"/></g><text class="cn" x="28" y="285">baseline</text><text class="cs" x="28" y="302">every tool supports it</text><g class="box opt"><rect x="224" y="264" width="200" height="48" rx="8"/></g><text class="cn" x="236" y="285">obsidian</text><text class="cs" x="236" y="302">wikilinks, embeds; optional</text><text class="rl" x="16" y="340">Profiles</text><text class="rs" x="86" y="340">whose types it uses</text><g class="prof"><rect x="16" y="352" width="190" height="48" rx="8"/></g><text class="cn" x="28" y="373">evidence</text><text class="cs" x="28" y="390">sources, findings, claims</text><g class="prof"><rect x="234" y="352" width="190" height="48" rx="8"/></g><text class="cn" x="246" y="373">acceptance testing</text><text class="cs" x="246" y="390">+ build, commit, environment</text><path class="edge" d="M232,376 L208,376" marker-end="url(#ah)"/><text class="cs" x="16" y="418">acceptance testing builds on evidence:</text><text class="cs" x="16" y="434">it adds, it never loosens.</text><g class="box"><rect x="234" y="434" width="190" height="48" rx="8"/></g><text class="cn" x="246" y="455">your corpus</text><text class="cs" x="246" y="472">its own types + the profile</text><path class="edge" d="M329,432 L329,402" marker-end="url(#ah)"/><text class="cs" x="16" y="464">So a record valid under acceptance</text><text class="cs" x="16" y="480">testing is also valid under evidence.</text></svg>
